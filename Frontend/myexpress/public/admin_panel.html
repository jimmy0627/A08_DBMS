<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Terminal // PRTS Database</title>
    <link rel="stylesheet" href="/stylesheets/style.css">
    <script src="/javascripts/auth.js"></script>
    <script defer src="/javascripts/global_search.js"></script>
    <script defer src="/javascripts/admin_panel.js"></script>
</head>
<body>
    <div class="page-shell">
        <header class="topbar">
            <div class="logo"><a href="/">RHODES ISLAND ADMIN</a></div>
            <div class="header-search">
                <input type="text" placeholder="搜尋幹員、素材、關卡...">
            </div>
            <div class="header-actions">
                <!-- Auth will handle this -->
            </div>
        </header>

        <main class="dashboard">
            <div class="section-title" style="margin-bottom: 24px; color: var(--red); font-size: 1.5rem; font-weight: 800;">
                // SYSTEM_ADMIN_TERMINAL // 高階管理終端
            </div>

            <div class="admin-grid">
                <!-- Data Entry Dashboard -->
                <section class="panel" style="grid-column: span 2; border-bottom: 4px solid var(--teal);">
                    <div class="panel-title">[ 檔案錄入系統 // DOSSIER_SYSTEM ]</div>
                    <div style="padding: 20px; display: flex; gap: 20px; align-items: center;">
                        <div style="flex: 1;">
                            <h3 style="color: var(--teal); margin-bottom: 10px;">幹員檔案全方位錄入終端</h3>
                            <p style="color: #888; font-size: 0.9rem;">
                                使用「分頁導向」的高級錄入模式，支持一次性建立幹員的基本資料、數值、技能、模組與素材消耗（涉及 9 個資料表）。
                            </p>
                        </div>
                        <a href="/operator_admin.html" class="btn btn-teal" style="padding: 15px 30px; font-weight: bold; letter-spacing: 1px;">
                            啟動錄入導引 (WIZARD_START)
                        </a>
                    </div>
                </section>

                <!-- Add Operator Form (Legacy Single-Table) -->
                <section class="panel admin-form-section">
                    <div class="panel-title">[ 新增幹員檔案 // CREATE_OPERATOR ]</div>
                    <form id="form-add-operator" class="admin-form">
                        <div class="form-group">
                            <label>幹員代號 (Name)</label>
                            <input type="text" name="name" placeholder="例如: 能天使" required>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>稀有度 (Rarity)</label>
                                <select name="rarity">
                                    <option value="6">6星</option>
                                    <option value="5">5星</option>
                                    <option value="4">4星</option>
                                    <option value="3">3星</option>
                                    <option value="2">2星</option>
                                    <option value="1">1星</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>職業 (Class)</label>
                                <select name="class">
                                    <option value="先鋒">先鋒</option>
                                    <option value="近衛">近衛</option>
                                    <option value="重裝">重裝</option>
                                    <option value="狙擊">狙擊</option>
                                    <option value="術師">術師</option>
                                    <option value="輔助">輔助</option>
                                    <option value="特種">特種</option>
                                    <option value="醫療">醫療</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>分支 (Branch)</label>
                                <input type="text" name="branch" placeholder="例如: 速射手" required>
                            </div>
                            <div class="form-group">
                                <label>位置 (Position)</label>
                                <select name="position">
                                    <option value="近戰位">近戰位</option>
                                    <option value="遠程位">遠程位</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>性別 (Sex)</label>
                            <select name="sex">
                                <option value="女">女</option>
                                <option value="男">男</option>
                                <option value="無">無</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>頭像 URL (Avatar)</label>
                            <input type="text" name="avatar_url" placeholder="/static/images/avatars/name.png">
                        </div>
                        <div class="form-group">
                            <label>立繪 URL (Portrait)</label>
                            <input type="text" name="portrait_url" placeholder="/static/images/portraits/name.png">
                        </div>
                        <button type="submit" class="btn btn-teal">錄入人事檔案</button>
                    </form>
                </section>

                <div class="admin-sidebar">
                    <!-- Add Material Form -->
                    <section class="panel admin-form-section">
                        <div class="panel-title">[ 新增素材 // ADD_MATERIAL ]</div>
                        <form id="form-add-material" class="admin-form">
                            <div class="form-group">
                                <label>素材名稱</label>
                                <input type="text" name="name" placeholder="例如: D32鋼" required>
                            </div>
                            <div class="form-group">
                                <label>圖片 URL</label>
                                <input type="text" name="icon_url" placeholder="/static/images/materials/name.png">
                            </div>
                            <div class="form-group">
                                <label>稀有度 (Rarity)</label>
                                <select name="rarity" class="form-select">
                                    <option value="1">1 (白色/基礎)</option>
                                    <option value="2">2 (綠色/普通)</option>
                                    <option value="3">3 (藍色/稀有)</option>
                                    <option value="4">4 (紫色/罕見)</option>
                                    <option value="5">5 (金色/極其罕見)</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-teal">新增素材數據</button>
                        </form>
                    </section>

                    <!-- Add Stage Form -->
                    <section class="panel admin-form-section" style="margin-top: 24px;">
                        <div class="panel-title">[ 建立作戰區域 // CREATE_STAGE ]</div>
                        <form id="form-add-stage" class="admin-form">
                            <div class="form-group">
                                <label>作戰編號 (ID)</label>
                                <input type="text" name="stage_id" placeholder="例如: 7-15" required>
                            </div>
                            <div class="form-group">
                                <label>作戰名稱</label>
                                <input type="text" name="name" placeholder="例如: 感染者的防禦線" required>
                            </div>
                            <div class="form-group">
                                <label>理智消耗</label>
                                <input type="number" name="energy_cost" value="18" required>
                            </div>
                            <div class="form-group">
                                <label>地圖圖片 URL (Map URL)</label>
                                <input type="text" name="map_url" placeholder="例如: /static/images/maps/stage_7_15.png">
                            </div>
                            <div class="form-group">
                                <label>作戰描述 (Description)</label>
                                <textarea name="description" placeholder="輸入關卡描述或戰術簡報..." style="background: rgba(255,255,255,0.03); border: 1px solid var(--border); color: var(--text); padding: 10px; font-family: inherit; resize: vertical; min-height: 80px;"></textarea>
                            </div>
                            
                            <!-- 掉落配置區域 -->
                            <div style="margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--border);">
                                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                                    <label style="border: none; color: var(--teal); font-size: 0.9rem;">掉落配置 (可選)</label>
                                    <button type="button" id="btn-add-drop" class="btn-mini" style="background: var(--teal); color: #000; padding: 6px 12px; border: none; cursor: pointer; font-weight: bold; font-size: 0.8rem;">+ 新增掉落</button>
                                </div>
                                
                                <div id="drops-container" style="display: flex; flex-direction: column; gap: 12px;">
                                    <!-- 動態掉落記錄將添加到此處 -->
                                </div>
                            </div>
                            
                            <button type="submit" class="btn btn-teal">配置作戰區域</button>
                        </form>
                    </section>
                </div>
            </div>
        </main>

        <footer class="footer">
            <p>PRTS // Administrative Interface v1.0</p>
        </footer>
    </div>

    <style>
        .admin-grid {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 24px;
        }
        .admin-form {
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        label {
            font-size: 0.75rem;
            color: var(--muted);
            font-weight: 700;
        }
        input, select, textarea {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            padding: 10px;
            color: var(--text);
            font-size: 0.9rem;
            border-radius: 0;
            outline: none;
        }
        input:focus, select:focus, textarea:focus {
            border-color: var(--teal);
            background: rgba(41, 182, 246, 0.05);
        }
        .btn-teal {
            background: var(--teal);
            color: #000;
            border: none;
            padding: 12px;
            font-weight: 800;
            cursor: pointer;
            margin-top: 10px;
            text-transform: uppercase;
        }
        .btn-teal:hover {
            filter: brightness(1.2);
        }
        @media (max-width: 900px) {
            .admin-grid { grid-template-columns: 1fr; }
        }
    </style>
</body>
</html>
