<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guide Editor // Rhodes Island Database</title>
  <link rel="stylesheet" href="stylesheets/style.css">
  <style>
    .editor-container {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .editor-panel {
      background: #111;
      border: 1px solid var(--border);
      padding: 32px;
    }

    .editor-header-area {
      margin-bottom: 30px;
      border-bottom: 2px solid var(--border);
      padding-bottom: 15px;
    }

    .status-indicator {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--teal);
      margin-top: 5px;
      display: block;
      font-weight: 800;
    }

    .form-group {
      margin-bottom: 24px;
    }

    .form-label {
      display: block;
      font-size: 0.75rem;
      color: var(--muted);
      font-weight: 800;
      margin-bottom: 8px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .editor-input, .editor-select, .editor-textarea {
      width: 100%;
      background: #0a0a0a;
      border: 1px solid #333;
      color: var(--text);
      padding: 12px 16px;
      font-family: inherit;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .editor-input:focus, .editor-select:focus, .editor-textarea:focus {
      border-color: var(--teal);
    }

    .editor-select {
      appearance: none;
      cursor: pointer;
    }

    .editor-textarea {
      min-height: 300px;
      resize: vertical;
      line-height: 1.6;
    }

    .action-group {
      display: flex;
      gap: 16px;
      margin-top: 32px;
    }

    .btn-editor {
      padding: 12px 24px;
      font-weight: 800;
      font-size: 0.9rem;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }

    .btn-submit {
      background: var(--teal);
      color: #000;
    }

    .btn-submit:hover {
      background: #40c4ff;
    }

    .btn-cancel {
      background: transparent;
      border: 1px solid #444;
      color: #888;
    }

    .btn-cancel:hover {
      border-color: var(--muted);
      color: var(--text);
    }

    .btn-editor:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
  <script src="/javascripts/auth.js"></script>
  <script defer src="/javascripts/guide_editor.js"></script>
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <a href="/" class="logo">RHODES ISLAND DATABASE</a>
      <div class="header-actions">
        <!-- Auth injected by auth.js -->
      </div>
    </header>

    <main class="editor-container">
      <section class="editor-panel">
        <div class="editor-header-area">
          <h2 class="dossier-header" style="border-bottom:none; margin-bottom:0; padding-bottom:0;">CREATE NEW COMBAT RECORD // 戰術日誌錄入</h2>
          <span class="status-indicator" id="status-text">STATUS: AWAITING INPUT...</span>
        </div>

        <form id="guide-form">
          <div class="form-group">
            <label class="form-label">TARGET STAGE // 目標作戰區域</label>
            <select id="stage-id" class="editor-select" required>
              <option value="" disabled selected>[ SELECT MISSION AREA ]</option>
              <!-- Loaded via JS -->
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">RECORD TITLE // 檔案標題</label>
            <input type="text" id="guide-title" class="editor-input" placeholder="[ ENTER TITLE ]" required>
          </div>

          <div class="form-group">
            <label class="form-label">TACTICAL LOG // 戰術詳述</label>
            <textarea id="guide-content" class="editor-textarea" placeholder="在此輸入作戰詳情、幹員配置與戰術重點..." required></textarea>
          </div>

          <div class="action-group">
            <button type="submit" id="submit-btn" class="btn-editor btn-submit">[ SUBMIT // 授權發布 ]</button>
            <button type="button" class="btn-editor btn-cancel" onclick="history.back()">[ CANCEL // 中止錄入 ]</button>
          </div>
        </form>
      </section>
    </main>

    <footer class="footer">
      <p>PRTS // TACTICAL DATA ENTRY TERMINAL</p>
    </footer>
  </div>
</body>
</html>
