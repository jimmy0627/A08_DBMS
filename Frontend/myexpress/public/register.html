<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Personnel Registration // Rhodes Island Database</title>
  <link rel="stylesheet" href="stylesheets/style.css">
  <style>
    .register-container {
      max-width: 500px;
      margin: 40px auto;
      padding: 30px;
      border: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.4);
      position: relative;
    }
    .register-container::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: var(--teal);
    }
    .register-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--teal);
      margin-bottom: 20px;
      letter-spacing: 2px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }
    .form-group {
      margin-bottom: 20px;
      position: relative;
    }
    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 800;
      color: var(--teal);
      margin-bottom: 8px;
    }
    .form-group input {
      width: 100%;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px;
      font-size: 1rem;
      outline: none;
      transition: var(--transition);
      font-family: inherit;
    }
    .form-group input:focus {
      border-color: var(--teal);
      background: rgba(41, 182, 246, 0.05);
    }
    .hint-text {
      font-size: 0.65rem;
      color: var(--muted);
      margin-top: 5px;
      font-weight: 400;
    }
    .availability-badge {
      position: absolute;
      right: 0;
      top: 0;
      font-size: 0.7rem;
      font-weight: 800;
      display: none;
    }
    .security-level-container {
      margin-top: 8px;
    }
    .security-level-text {
      font-size: 0.65rem;
      font-weight: 800;
      color: var(--muted);
      margin-bottom: 4px;
      display: block;
    }
    .security-level-bg {
      height: 3px;
      background: var(--border);
      width: 100%;
    }
    .security-level-bar {
      height: 100%;
      width: 0%;
      background: var(--red);
      transition: width 0.3s, background-color 0.3s;
    }
    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 24px 0;
    }
    .checkbox-group input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }
    .checkbox-group label {
      font-size: 0.85rem;
      color: var(--text);
      cursor: pointer;
    }
    .register-footer {
      margin-top: 30px;
      border-top: 1px solid var(--border);
      padding-top: 20px;
      text-align: center;
    }
  </style>
  <script src="/javascripts/auth.js"></script>
  <script defer src="/javascripts/register.js"></script>
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <div class="logo" onclick="location.href='/'" style="cursor: pointer;">RHODES ISLAND DATABASE</div>
      <div class="header-actions">
        <!-- Auth will inject buttons if needed -->
      </div>
    </header>

    <main class="register-page">
      <div class="register-container panel">
        <h2 class="register-title">DOSSIER CREATION // 人事建檔</h2>
        
        <form id="register-form">
          <!-- Codename -->
          <div class="form-group">
            <label for="codename">
              CODENAME // 幹員代號
              <span id="availability-badge" class="availability-badge">[ CHECKING... ]</span>
            </label>
            <input type="text" id="codename" required placeholder="請輸入您的代號" minlength="3" maxlength="16">
            <p class="hint-text">[ 系統將作為公開識別碼，長度限制 3-16 字元 ]</p>
          </div>

          <!-- Email -->
          <div class="form-group">
            <label for="email">COMM_LINK // 聯絡終端 (Email)</label>
            <input type="email" id="email" required placeholder="example@rhodes.com">
            <p class="hint-text">[ 用於鑰找回、系統通知與帳號登入 ]</p>
          </div>

          <!-- Password -->
          <div class="form-group">
            <label for="password">SECURITY KEY // 密碼</label>
            <input type="password" id="password" required placeholder="••••••••">
            <div class="security-level-container">
              <span class="security-level-text">SECURITY LEVEL: NONE</span>
              <div class="security-level-bg">
                <div class="security-level-bar"></div>
              </div>
            </div>
          </div>

          <!-- Confirm Password -->
          <div class="form-group">
            <label for="confirm-password">VERIFY KEY // 密碼確認</label>
            <input type="password" id="confirm-password" required placeholder="••••••••">
          </div>

          <!-- Captcha -->
          <div class="form-group">
            <label for="captcha">NEURAL NETWORK CHECK // 防爬蟲問題</label>
            <input type="text" id="captcha" required placeholder="提示：誰是明日方舟的看板娘？">
            <p class="hint-text">[ 請輸入看板娘名稱]</p>
          </div>

          <!-- Protocols -->
          <div class="checkbox-group">
            <input type="checkbox" id="protocols" required>
            <label for="protocols">ACCEPT RHODES ISLAND PROTOCOLS // 同意資料保密協定</label>
          </div>

          <button type="submit" class="btn btn-filled btn-teal" id="submit-btn" style="width: 100%; padding: 15px; font-weight: 800;">
            <span class="btn-text">SUBMIT DOSSIER // 提交建檔申請</span>
          </button>
        </form>

        <div class="register-footer">
          <p style="font-size: 0.85rem; color: var(--muted);">
            EXISTING PERSONNEL? 
            <a href="/login.html" style="color: var(--teal); font-weight: 800; text-decoration: underline;">RETURN TO LOGIN // 返回登入</a>
          </p>
        </div>
      </div>
    </main>

    <footer class="footer" style="margin-top: 40px;">
      <p>PRTS // Rhodes Island Database Interface v2.0</p>
    </footer>
  </div>
</body>
</html>
