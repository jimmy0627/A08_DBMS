<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REGISTER // PRTS TERMINAL</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- Styles -->
    <link rel="stylesheet" href="stylesheets/style.css">
    <link rel="stylesheet" href="stylesheets/auth.css">
</head>
<body class="auth-page">
    <div class="auth-bg-deco"></div>

    <div class="auth-panel" style="max-width: 500px;">
        <div id="auth-loading" class="auth-loading" style="display:none;">
            <div class="loading-scanner"></div>
            <div class="loading-text">CREATING IDENTITY DOSSIER...</div>
        </div>

        <div class="auth-header">
            <h1 class="auth-title">IDENT_CREATE</h1>
            <span class="auth-subtitle">RHODES ISLAND PERSONNEL MANAGEMENT SYSTEM</span>
        </div>

        <div class="auth-body">
            <div id="auth-message" class="auth-message" style="display:none;"></div>

            <form id="register-form">
                <div class="auth-form-group">
                    <label class="auth-label">PERSONNEL_ID // 公開代號</label>
                    <div class="auth-input-wrapper">
                        <input type="text" id="nickname" class="auth-input" placeholder="CODENAME_HERE" required>
                    </div>
                </div>

                <div class="auth-form-group">
                    <label class="auth-label">COMM_LINK // 聯絡郵箱</label>
                    <div class="auth-input-wrapper">
                        <input type="email" id="email" class="auth-input" placeholder="ACCESS_ID@RHODES.NET" required>
                    </div>
                </div>

                <div class="auth-form-group">
                    <label class="auth-label">SECURE_CREDENTIAL // 安全密碼</label>
                    <div class="auth-input-wrapper">
                        <input type="password" id="password" class="auth-input" placeholder="••••••••••••" required>
                    </div>
                </div>

                <div class="auth-form-group">
                    <label class="auth-label">CONFIRM_CREDENTIAL // 密碼確認</label>
                    <div class="auth-input-wrapper">
                        <input type="password" id="confirm-password" class="auth-input" placeholder="••••••••••••" required>
                    </div>
                </div>

                <div class="auth-actions">
                    <button type="submit" class="auth-btn" id="submit-btn">
                        <span class="btn-text">CONFIRM_REGISTRATION // 提交建檔</span>
                    </button>
                </div>
            </form>
        </div>

        <div class="auth-footer">
            <a href="/login.html" class="auth-link">EXISTING_IDENTITY? PROCEED_TO_LOGIN // 返回登入</a>
        </div>
    </div>

    <script src="javascripts/auth.js"></script>
    <script src="javascripts/register.js"></script>
</body>
</html>
