<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>User Dossier // Rhodes Island Database</title>
  <link rel="stylesheet" href="stylesheets/style.css">
  <style>
    /* Profile Specific Modules */
    .profile-dashboard {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-top: 20px;
    }
    
    .full-width {
      grid-column: 1 / -1;
    }

    /* Module 1: User Dossier */
    .dossier-panel {
      background: #151515;
      padding: 24px;
      border: 1px solid var(--border);
    }
    .dossier-header {
      font-weight: 800;
      color: var(--teal);
      margin-bottom: 20px;
      letter-spacing: 0.1em;
      border-bottom: 2px solid var(--border);
      padding-bottom: 10px;
      text-transform: uppercase;
    }
    .dossier-content {
      display: flex;
      align-items: center;
      gap: 24px;
    }
    .avatar-frame {
      width: 80px;
      height: 80px;
      background: #0a0a0a;
      border: 1px solid #333;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .avatar-frame img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }
    .user-info {
      flex-grow: 1;
    }
    .user-name {
      font-size: 1.6rem;
      font-weight: 800;
      margin: 0;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .user-meta {
      color: var(--muted);
      font-size: 0.8rem;
      margin: 4px 0;
      font-family: monospace;
    }
    .auth-tag {
      background: var(--teal);
      color: #000;
      font-size: 0.7rem;
      font-weight: 900;
      padding: 2px 10px;
      display: inline-block;
      margin-top: 10px;
      letter-spacing: 1px;
    }
    .stats-area {
      display: flex;
      gap: 40px;
      text-align: right;
    }
    .stat-item .stat-value {
      display: block;
      font-size: 2.5rem;
      font-weight: 800;
      line-height: 1;
      color: var(--text);
    }
    .stat-item .stat-label {
      font-size: 0.6rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 5px;
      display: block;
    }

    /* Module 2: Development Tracker */
    .tracker-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .tracker-item {
      display: flex;
      align-items: center;
      padding: 16px 8px;
      border-bottom: 1px solid var(--border);
    }
    .tracker-item:last-child {
      border-bottom: none;
    }
    .op-identity {
      width: 160px;
    }
    .op-identity h4 {
      margin: 0;
      font-size: 1rem;
      font-weight: 800;
    }
    .op-identity span {
      font-size: 0.7rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .progress-display {
      flex-grow: 1;
      text-align: center;
      font-family: monospace;
      font-size: 0.95rem;
    }
    .progress-target {
      color: var(--teal);
      font-weight: 800;
    }
    .arrow-sep {
      margin: 0 15px;
      color: var(--muted);
      font-weight: bold;
    }
    .btn-material {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 16px;
      font-size: 0.75rem;
      cursor: pointer;
      transition: var(--transition);
      font-weight: 800;
    }
    .btn-material:hover {
      border-color: var(--teal);
      color: var(--teal);
      background: rgba(41, 182, 246, 0.05);
    }

    /* Module 3: Combat Records */
    .records-container {
        display: flex;
        flex-direction: column;
    }
    .record-item {
      display: flex;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      transition: var(--transition);
      cursor: pointer;
    }
    .record-item:hover {
      background: rgba(41, 182, 246, 0.03);
    }
    .record-item.moderated {
      background: rgba(211, 47, 47, 0.04);
    }
    .record-item.moderated:hover {
        background: rgba(211, 47, 47, 0.08);
    }
    .record-stage {
      color: var(--teal);
      font-weight: 900;
      width: 90px;
      font-size: 1.1rem;
      letter-spacing: 0.05em;
    }
    .record-main {
      flex-grow: 1;
    }
    .record-title {
      font-size: 1rem;
      font-weight: 800;
    }
    .guide-link {
        color: var(--text);
        text-decoration: none;
        transition: var(--transition);
        font-weight: 800;
        border-bottom: 1px solid transparent;
    }
    .guide-link:hover {
        color: var(--teal);
        border-bottom-color: var(--teal);
    }
    .record-meta {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 4px;
      display: flex;
      align-items: center;
    }
    .status-tag {
      font-size: 0.65rem;
      font-weight: 900;
      margin-left: 10px;
      padding: 1px 4px;
    }
    .status-published { color: var(--teal); }
    .status-moderated { color: var(--red); }

    /* Module 4: Roster Grid */
    .roster-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
      gap: 16px;
      padding: 10px 0;
    }
    .roster-unit {
      text-align: center;
    }
    .unit-thumb {
      aspect-ratio: 1;
      background: #111;
      border: 1px solid var(--border);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      color: #222;
      font-size: 1.8rem;
      background-size: cover;
      background-position: center;
      position: relative;
    }
    .unit-delete {
      position: absolute;
      top: -6px;
      right: -6px;
      background: var(--red);
      color: #fff;
      border: none;
      width: 20px;
      height: 20px;
      font-size: 14px;
      line-height: 20px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: all 0.2s;
      box-shadow: 0 0 10px rgba(255, 61, 0, 0.4);
      z-index: 10;
    }
    .roster-unit:hover .unit-delete {
      opacity: 1;
      transform: scale(1.1);
    }
    .unit-delete:hover {
      background: #ff5722;
      transform: scale(1.3) !important;
    }
    .unit-thumb::after {
        content: "";
        position: absolute;
        bottom: 0;
        right: 0;
        width: 0;
        height: 0;
        border-style: solid;
        border-width: 0 0 10px 10px;
        border-color: transparent transparent var(--border) transparent;
    }
    .unit-level {
      font-size: 0.65rem;
      color: var(--muted);
      font-weight: 800;
      font-family: monospace;
      text-transform: uppercase;
    }

    /* Redesigned Tracker Styles */
    .tracker-item {
        flex-direction: column;
        align-items: stretch;
        background: rgba(255, 255, 255, 0.02);
        margin-bottom: 12px;
        border: 1px solid var(--border);
        padding: 0;
    }
    .tracker-main-row {
        display: flex;
        align-items: center;
        padding: 16px 20px;
        border-bottom: 1px solid transparent;
        transition: var(--transition);
    }
    .tracker-item.active .tracker-main-row {
        border-color: rgba(41, 182, 246, 0.2);
        background: rgba(41, 182, 246, 0.03);
    }
    .op-brief {
        width: 180px;
    }
    .op-brief h4 {
        margin: 0;
        font-size: 1.3rem;
        font-weight: 800;
        color: var(--text);
    }
    .op-brief span {
        font-size: 0.85rem;
        color: var(--teal);
        font-weight: 900;
        letter-spacing: 1px;
    }
    .inputs-area {
        flex-grow: 1;
        display: flex;
        align-items: center;
        gap: 8px;
        justify-content: center;
    }
    .select-group {
        display: flex;
        align-items: center;
        gap: 4px;
        background: #000;
        border: 1px solid var(--border);
        padding: 2px 8px;
    }
    .select-group label {
        font-size: 0.75rem;
        font-weight: 800;
        color: var(--muted);
    }
    .tracker-select {
        background: transparent;
        border: none;
        color: var(--teal);
        font-weight: 800;
        font-family: 'JetBrains Mono', monospace;
        cursor: pointer;
        padding: 6px;
        outline: none;
        font-size: 1rem;
    }
    .tracker-select option {
        background: #111;
        color: #fff;
    }
    .level-input {
        width: 35px;
        background: transparent;
        border: none;
        color: #fff;
        text-align: center;
        font-weight: 800;
        font-family: inherit;
        outline: none;
    }
    .btn-recalc {
        padding: 10px 20px;
        border: 1px solid var(--teal);
        background: transparent;
        color: var(--teal);
        font-size: 0.95rem;
        font-weight: 800;
        cursor: pointer;
        transition: var(--transition);
        margin-left: 20px;
    }
    .btn-recalc:hover {
        background: var(--teal);
        color: #000;
        box-shadow: 0 0 15px rgba(41, 182, 246, 0.3);
    }

    /* Accordion Area */
    .material-accordion {
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.4s cubic-bezier(0, 1, 0, 1);
        background: rgba(0, 0, 0, 0.3);
    }
    .material-accordion.show {
        max-height: 2000px;
        transition: max-height 0.8s ease-in-out;
        border-top: 1px solid var(--border);
    }
    .materials-inner {
        padding: 20px;
    }
    .material-report-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 12px;
    }
    .mat-card {
        background: #0d0d0d;
        border-left: 3px solid var(--border);
        padding: 12px;
        display: grid;
        grid-template-columns: 48px 1fr;
        gap: 16px;
        align-items: center;
    }
    .mat-card.has-data { border-left-color: var(--teal); }
    .mat-card.no-data { border-left-color: var(--red); }
    
    .mat-icon-box {
        width: 48px;
        height: 48px;
        background: #000;
        border: 1px solid #333;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .mat-info-top {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
    }
    .mat-name { font-weight: 800; font-size: 1.1rem; }
    .mat-req { color: var(--teal); font-weight: 900; font-size: 1.3rem; }
    .mat-stage-info {
        font-size: 0.9rem;
        margin-top: 4px;
        color: var(--muted);
    }
    .mat-stage-id { color: var(--text); font-weight: 800; }
    .mat-prediction {
        margin-top: 6px;
        font-size: 0.85rem;
        color: #f0c14b; /* Gold/Orange */
        font-weight: 700;
        letter-spacing: 0.5px;
    }
    .no-data-msg {
        color: var(--red);
        font-weight: 800;
        font-size: 0.7rem;
        margin-top: 5px;
    }
  </style>
  <script src="/javascripts/auth.js"></script>
  <script defer src="/javascripts/global_search.js"></script>
  <script defer src="/javascripts/profile.js"></script>
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <a href="/" class="logo">RHODES ISLAND DATABASE</a>
      <div class="header-search">
        <input type="text" placeholder="搜尋幹員、素材、關卡...">
      </div>
      <div class="header-actions">
        <!-- Auth injected by auth.js -->
      </div>
    </header>

    <main class="profile-container">
      
      <!-- Module 1: User Dossier -->
      <section class="dossier-panel full-width">
        <h2 class="dossier-header">USER DOSSIER // 身份識別檔案</h2>
        <div class="dossier-content">
          <div class="avatar-frame">
            <img id="profile-avatar" src="https://via.placeholder.com/80/0a0a0a/333333?text=RI" alt="AVATAR">
          </div>
          <div class="user-info">
            <h1 class="user-name" id="profile-nickname">LOADING...</h1>
            <p class="user-meta" id="profile-uid">PENDING...</p>
            <p class="user-meta" id="profile-email">PENDING...</p>
            <span class="auth-tag">[ AUTHORIZED USER ]</span>
          </div>
          <div class="stats-area">
            <div class="stat-item">
              <span class="stat-value" id="count-operators">..</span>
              <span class="stat-label">OPERATORS 持有</span>
            </div>
            <div class="stat-item">
              <span class="stat-value" id="count-guides">..</span>
              <span class="stat-label">GUIDES 攻略</span>
            </div>
          </div>
          </div>
        </div>
      </section>

      <div class="profile-dashboard">
        <!-- Module 2: Development Tracker -->
        <section class="panel" style="padding: 24px;">
          <h2 class="dossier-header" style="font-size: 1.1rem;">DEVELOPMENT TRACKER // 育成任務追蹤</h2>
          <ul class="tracker-list" id="tracker-list">
            <li class="loading-state" style="padding: 20px; color: var(--muted); font-size: 0.85rem; font-weight: 800;">[ STATUS ] 正在讀取育成進度...</li>
          </ul>
        </section>

        <!-- Module 3: Combat Records -->
        <section class="panel" style="padding: 24px;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid var(--border); padding-bottom: 10px;">
            <h2 class="dossier-header" style="font-size: 1.1rem; border-bottom: none; margin-bottom: 0; padding-bottom: 0;">COMBAT RECORDS // 戰術授權紀錄</h2>
            <button onclick="location.href='/guide_editor.html'" style="background: var(--teal); color: #000; border: none; padding: 6px 12px; font-weight: 800; font-size: 0.75rem; cursor: pointer;">[ + NEW RECORD // 新增戰術紀錄 ]</button>
          </div>
          <div class="records-container" id="guides-list">
            <div class="loading-state" style="padding: 20px; color: var(--muted); font-size: 0.85rem; font-weight: 800;">[ STATUS ] 正在檢索戰術紀錄...</div>
          </div>
        </section>

        <!-- Module 4: Roster Grid -->
        <section class="panel full-width" style="padding: 24px;">
          <h2 class="dossier-header" style="font-size: 1.1rem;">ROSTER // 個人幹員庫</h2>
          <div class="roster-grid" id="roster-grid">
             <!-- Units injected by JS -->
          </div>
          <button class="btn btn-filled btn-teal" style="width: 100%; margin-top: 30px; font-weight: 800; padding: 15px;" onclick="location.href='/operators'">
            UPDATE ROSTER // 更新幹員名冊
          </button>
        </section>
      </div>

    </main>

    <footer class="footer" style="margin-top: 40px;">
      <p>PRTS // PERSONNEL ARCHIVE v2.0</p>
    </footer>
  </div>
</body>
</html>
