<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGIN // PRTS TERMINAL</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- Styles -->
    <link rel="stylesheet" href="stylesheets/style.css">
    <link rel="stylesheet" href="stylesheets/auth.css">
</head>
<body class="auth-page">
    <div class="auth-bg-deco"></div>

    <div class="auth-panel">
        <div id="auth-loading" class="auth-loading">
            <div class="loading-scanner"></div>
            <div class="loading-text">VERIFYING IDENTITY...</div>
        </div>

        <div class="auth-header">
            <h1 class="auth-title">IDENT_LOGIN</h1>
            <span class="auth-subtitle">RHODES ISLAND CENTRAL COMPUTER // PRTS</span>
        </div>

        <div class="auth-body">
            <div id="auth-message" class="auth-message"></div>

            <form id="login-form">
                <div class="auth-form-group">
                    <label class="auth-label">USER_EMAIL // 註冊郵箱</label>
                    <div class="auth-input-wrapper">
                        <input type="email" id="email" class="auth-input" placeholder="ACCESS_ID@RHODES.NET" required>
                    </div>
                </div>

                <div class="auth-form-group">
                    <label class="auth-label">SECURE_CREDENTIAL // 安全密碼</label>
                    <div class="auth-input-wrapper">
                        <input type="password" id="password" class="auth-input" placeholder="••••••••••••" required>
                    </div>
                </div>

                <div class="auth-actions">
                    <button type="submit" class="auth-btn">CONFIRM_LOGIN // 登入系統</button>
                </div>
            </form>
        </div>

        <div class="auth-footer">
            <a href="/register.html" class="auth-link">NO_ACCOUNT? CREATE_NEW_IDENTITY // 立即註冊</a>
            <div style="margin-top:10px;">
                <a href="/" class="auth-link" style="opacity:0.5;">[ RETURN_TO_DASHBOARD ]</a>
            </div>
        </div>
    </div>

    <script src="javascripts/auth.js"></script>
</body>
</html>
