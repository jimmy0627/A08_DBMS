<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login // Rhodes Island Database</title>
  <link rel="stylesheet" href="stylesheets/style.css">
  <style>
    .login-container {
      max-width: 400px;
      margin: 100px auto;
      padding: 30px;
      border: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.4);
      position: relative;
    }
    .login-container::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: var(--teal);
    }
    .login-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--teal);
      margin-bottom: 20px;
      letter-spacing: 2px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .form-group input {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.3s;
    }
    .form-group input:focus {
      border-color: var(--teal);
    }
    .login-footer {
      margin-top: 30px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .error-msg {
      color: #ff5252;
      font-size: 0.85rem;
      margin-top: 10px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <div class="logo" onclick="location.href='/'" style="cursor: pointer;">RHODES ISLAND DATABASE</div>
      <div class="header-actions">
        <!-- Auth state will be injected here -->
      </div>
    </header>

    <main class="login-page">
      <div class="login-container panel">
        <h2 class="login-title" style="font-weight: 800; letter-spacing: 0.1em; margin-bottom: 30px;">USER AUTHENTICATION // 身份驗證</h2>
        <form id="login-form">
          <div class="form-group">
            <label style="font-weight: 800; color: var(--teal); display: flex; justify-content: space-between;">
              <span>EMAIL ADDRESS //</span>
              <span style="font-size: 0.6rem; color: var(--muted); font-weight: 400;">* REQUIRED</span>
            </label>
            <input type="email" id="email" required placeholder="example@rhodes.com" style="border: 1px solid var(--border); background: rgba(0,0,0,0.2); font-family: inherit; margin-top: 8px;">
          </div>
          
          <div class="form-group">
            <label style="font-weight: 800; color: var(--teal); display: flex; justify-content: space-between;">
              <span>PASSWORD //</span>
              <a href="#" style="font-size: 0.65rem; color: var(--muted); text-decoration: none; font-weight: 400;" onmouseover="this.style.color='var(--teal)'" onmouseout="this.style.color='var(--muted)'">FORGOT PASSWORD?</a>
            </label>
            <div style="position: relative; margin-top: 8px;">
              <input type="password" id="password" required placeholder="••••••••" style="border: 1px solid var(--border); background: rgba(0,0,0,0.2); font-family: inherit; width: 100%; padding-right: 40px;">
              <span id="toggle-password" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--muted); font-size: 0.9rem; user-select: none;">👁️</span>
            </div>
          </div>

          <div class="form-options" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 0.85rem; color: var(--muted); font-weight: 700;">
              <input type="checkbox" id="remember-me" style="width: 16px; height: 16px; accent-color: var(--teal); cursor: pointer;">
              REMEMBER ME // 保持登入
            </label>
          </div>

          <div id="error-message" class="error-msg" style="color: var(--red); font-size: 0.8rem; letter-spacing: 0.05em; font-weight: 800; margin-bottom: 20px;"></div>
          
          <div class="login-footer">
            <button type="submit" class="btn btn-filled btn-teal" style="width: 100%; padding: 14px; font-weight: 800; font-size: 0.9rem; margin-bottom: 10px;">CONFIRM LOGIN // 驗證登入</button>
            <div style="text-align: center; margin: 15px 0;">
              <p style="font-size: 0.8rem; color: var(--muted);">NEW TO RHODES ISLAND? // 尚未加入？</p>
              <a href="/register.html" class="btn btn-outline" style="display: block; width: 100%; padding: 12px; margin-top: 8px; font-weight: 800; font-size: 0.85rem; text-decoration: none; color: inherit;">CREATE ACCOUNT // 註冊新帳號</a>
            </div>
            <button type="button" class="btn btn-outline" style="width: 100%; padding: 12px; font-weight: 800; font-size: 0.85rem; color: var(--muted); border-color: transparent;" onclick="location.href='/'">ABORT MISSION // 撤回</button>
          </div>
        </form>
      </div>
    </main>
  </div>
  <script src="/javascripts/auth.js"></script>
  <script>
    // Password visibility toggle
    document.getElementById('toggle-password').addEventListener('click', function() {
      const passwordInput = document.getElementById('password');
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        this.textContent = '🕶️';
      } else {
        passwordInput.type = 'password';
        this.textContent = '👁️';
      }
    });

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('error-message');
      
      try {
        const result = await auth.login(email, password);
        if (result.status === 'success') {
          // Redirect to home or previous page
          location.href = '/';
        } else {
          errorDiv.textContent = result.message || 'Login failed';
          errorDiv.style.display = 'block';
        }
      } catch (err) {
        errorDiv.textContent = 'Connection error. Please try again.';
        errorDiv.style.display = 'block';
      }
    });
  </script>
</body>
</html>
